name: psr3_app
description: PSR3 Android application
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/covers/
    - assets/audio/
  fonts:
    - family: ZenMaru
      fonts:
        - asset: assets/fonts/ZenMaruGothicLight.ttf
          weight: 300
