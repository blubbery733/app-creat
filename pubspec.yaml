name: psr3_app
description: PSR3 Android companion application
publish_to: "none"
version: 0.4.3-beta.1+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.0
  flutter_svg: ^2.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/covers/
