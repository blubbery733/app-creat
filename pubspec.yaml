name: psr3_app
description: PSR3 companion app for Windows
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/psremake-logo.png
    - assets/startup-controller.webp
    - assets/remote-loading.webp
  fonts:
    - family: ZenMaru
      fonts:
        - asset: assets/fonts/ZenMaruGothicLight.ttf
          weight: 300
